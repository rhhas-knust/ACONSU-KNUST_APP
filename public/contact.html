<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="site-header"></header>

<section class="hero" style="padding-bottom:48px;">
  <div class="hero-flame"></div>
  <div class="hero-content">
    <p class="eyebrow">Reach Out</p>
    <h1>Contact Us</h1>
    <p class="lede">Questions, feedback, or just want to say hello? We'd love to hear from you.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container">
    <form class="form-card" id="contactForm">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="contactSubmitBtn">Send Message</button>
      <div class="form-msg" id="contactMsg"></div>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
initLayout('/contact.html');

document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('contactSubmitBtn');
  const msg = document.getElementById('contactMsg');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetchJSON('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      })
    });
    msg.textContent = "Message sent — we'll get back to you soon.";
    msg.className = 'form-msg success';
    showToast("Message sent — we'll get back to you soon.", 'success');
    document.getElementById('contactForm').reset();
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong. Please try again.';
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Message';
  }
});
</script>
</body>
</html>
