<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Admin — ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<!-- Shared with /admin.html deliberately: both pages render the same markup
     from js/admin.js, so they must not keep private copies of its styles. -->
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <form class="form-card" id="loginForm">
    <img src="/images/logo.jpg" alt="ACONSU" style="width:64px; height:64px; border-radius:50%; margin:0 auto 16px; display:block;">
    <h2 style="text-align:center;">Chapter Admin Login</h2>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    <div class="form-msg" id="loginMsg"></div>
  </form>
</div>

<div class="admin-shell" id="adminShell">
  <div class="admin-topbar">
    <div class="admin-topbar-left">
      <button type="button" class="mobile-nav-toggle" id="mobileNavBtn">☰</button>
      <strong id="adminBrandName">ACONSU Chapter Admin</strong>
      <!-- Which chapter you are administering, stated at all times. A Chapter
           Admin acts only inside their own chapter, so it belongs in the
           furniture rather than somewhere they have to go and check. -->
      <span class="chapter-badge" id="adminChapterBadge">Loading Chapter...</span>
    </div>
    <div class="admin-topbar-right">
      <button type="button" class="mobile-actions-toggle" id="mobileQuickActionsBtn">⚡</button>
      <button type="button" class="cmd-trigger" id="cmdPaletteBtn" title="Universal Command Palette">
        <span>🔍 Search &amp; Jump</span>
        <kbd>Ctrl+K</kbd>
      </button>
      <button type="button" class="theme-toggle theme-toggle-onbrand" id="themeToggle" aria-label="Switch between light and dark"></button>
      <button class="btn btn-outline btn-sm" id="logoutBtn" style="color:#fff; border-color:rgba(255,255,255,0.4);">Log Out</button>
    </div>
  </div>

  <div class="admin-layout">
    <!-- Grouped the same way as /admin.html. Every panel here is chapter work,
         so unlike that page nothing is tagged data-scope="chapter": there is
         no national scope to prune for. National-only panels (Global Settings,
         the National Portal link) are absent entirely rather than hidden. -->
    <div class="admin-side" id="adminNav">
      <div class="nav-group open" data-nav-group="overview">
        <button type="button" class="nav-group-toggle" data-toggle-group="overview"><span>📊 Overview</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="overview" class="active"><span class="nav-icon">📊</span> Overview</button>
        </div>
      </div>

      <div class="nav-group open" data-nav-group="people">
        <button type="button" class="nav-group-toggle" data-toggle-group="people"><span>👥 People &amp; Leadership</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="members"><span class="nav-icon">👥</span> Members Roster</button>
          <button data-panel="executives"><span class="nav-icon">🎓</span> Executives &amp; Verification</button>
          <button data-panel="staff"><span class="nav-icon">🔑</span> Leadership Accounts</button>
          <button data-panel="joinRequests"><span class="nav-icon">📥</span> Join Requests</button>
        </div>
      </div>

      <div class="nav-group open" data-nav-group="ministry">
        <button type="button" class="nav-group-toggle" data-toggle-group="ministry"><span>📖 Ministry &amp; Discipleship</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="bibleStudies"><span class="nav-icon">📖</span> Bible Study</button>
          <button data-panel="groups"><span class="nav-icon">👨‍👩‍👦</span> Small Groups &amp; Cells</button>
          <button data-panel="prayerRequests"><span class="nav-icon">🙏</span> Prayer Requests</button>
          <button data-panel="testimonies"><span class="nav-icon">✨</span> Testimonies</button>
          <button data-panel="sermons"><span class="nav-icon">🎧</span> Sermons &amp; Media</button>
          <button type="button" onclick="location.href='/content-manager.html'"><span class="nav-icon">📺</span> Media &amp; Content Hub</button>
        </div>
      </div>

      <div class="nav-group open" data-nav-group="operations">
        <button type="button" class="nav-group-toggle" data-toggle-group="operations"><span>🗓️ Operations &amp; Gatherings</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="events"><span class="nav-icon">🗓️</span> Events &amp; Calendar</button>
          <button data-panel="departments"><span class="nav-icon">🚪</span> Departments</button>
          <button data-panel="notifications"><span class="nav-icon">🔔</span> Push Notifications</button>
          <button data-panel="forms"><span class="nav-icon">🧩</span> Dynamic Form Builder</button>
        </div>
      </div>

      <div class="nav-group open" data-nav-group="care">
        <button type="button" class="nav-group-toggle" data-toggle-group="care"><span>🤝 Care &amp; Community</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="welfare"><span class="nav-icon">❤️</span> Welfare Requests</button>
          <button data-panel="chatModeration"><span class="nav-icon">💬</span> Chat Moderation</button>
          <button data-panel="contactMessages"><span class="nav-icon">✉️</span> Contact Messages</button>
        </div>
      </div>

      <div class="nav-group open" data-nav-group="settings">
        <button type="button" class="nav-group-toggle" data-toggle-group="settings"><span>⚙️ Chapter Settings</span><span class="chev">›</span></button>
        <div class="nav-group-body">
          <button data-panel="chapterSettings"><span class="nav-icon">🏢</span> Chapter Site Settings</button>
          <button data-panel="pages"><span class="nav-icon">📄</span> Custom Pages</button>
          <button data-panel="media"><span class="nav-icon">📁</span> Media Library</button>
          <button data-panel="reports"><span class="nav-icon">📑</span> Reports &amp; PDF Export</button>
        </div>
      </div>
    </div>
    <div class="admin-side-backdrop" id="adminSideBackdrop"></div>

    <div class="admin-main" id="adminMain">
      <div class="admin-panel active" id="panel-overview"></div>
      <div class="admin-panel" id="panel-members"></div>
      <div class="admin-panel" id="panel-executives"></div>
      <div class="admin-panel" id="panel-staff"></div>
      <div class="admin-panel" id="panel-joinRequests"></div>
      <div class="admin-panel" id="panel-bibleStudies"></div>
      <div class="admin-panel" id="panel-groups"></div>
      <div class="admin-panel" id="panel-prayerRequests"></div>
      <div class="admin-panel" id="panel-testimonies"></div>
      <div class="admin-panel" id="panel-sermons"></div>
      <div class="admin-panel" id="panel-events"></div>
      <div class="admin-panel" id="panel-departments"></div>
      <div class="admin-panel" id="panel-notifications"></div>
      <div class="admin-panel" id="panel-forms"></div>
      <div class="admin-panel" id="panel-welfare"></div>
      <div class="admin-panel" id="panel-chatModeration"></div>
      <div class="admin-panel" id="panel-contactMessages"></div>
      <div class="admin-panel" id="panel-chapterSettings"></div>
      <div class="admin-panel" id="panel-pages"></div>
      <div class="admin-panel" id="panel-media"></div>
      <div class="admin-panel" id="panel-reports"></div>
      <div class="app-watermark">Powered by HasTech Solutions</div>
    </div>
  </div>
</div>

<!-- Universal Command Palette Modal -->
<div class="cmd-palette-backdrop" id="cmdPaletteBackdrop">
  <div class="cmd-palette-box">
    <div class="cmd-input-wrap">
      <span>🔍</span>
      <input type="text" id="cmdInput" placeholder="Type a panel or action... (e.g. members, events, departments)" autocomplete="off">
    </div>
    <div class="cmd-list" id="cmdList"></div>
    <div class="cmd-footer">
      <span>Navigate: <kbd>↑</kbd> <kbd>↓</kbd> &nbsp;|&nbsp; Select: <kbd>Enter</kbd></span>
      <span>Close: <kbd>Esc</kbd></span>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
