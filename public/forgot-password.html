<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section style="padding-top:64px; padding-bottom:64px;">
  <div class="container">
    <form class="form-card" id="forgotForm" novalidate>
      <img src="/images/logo.jpg" alt="ACONSU" style="width:56px; height:56px; border-radius:50%; margin:0 auto 14px; display:block;">
      <h1 style="text-align:center; font-size:1.8rem;">Reset your password</h1>
      <p style="text-align:center; color:var(--ink-soft); margin-bottom:24px;">Type the phone number you sign in with, and we will text you a code. Or type your email address for a link.</p>
      <div class="field">
        <label for="email">Phone number or email</label>
        <input type="text" id="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div id="resetByCode" hidden>
        <div class="field">
          <label for="resetCode">The 6-digit code from the text</label>
          <input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        </div>
        <div class="field">
          <label for="newPassword">Choose a new password</label>
          <input type="password" id="newPassword" minlength="8" autocomplete="new-password" aria-describedby="newPasswordHint">
          <small class="hint" id="newPasswordHint" style="color:var(--ink-faint);">At least 8 characters.</small>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send</button>
      <div class="form-msg" id="forgotMsg" role="status" aria-live="polite"></div>
      <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--ink-soft);">
        <a href="/login.html" style="color:var(--brand); font-weight:700;">Back to log in</a>
      </p>
    </form>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
initLayout('/forgot-password.html');

// A phone number: a code by text (where the chapter can send texts), then the
// code and a new password here. An email address: a link by email, as before.
const $ = (id) => document.getElementById(id);
const looksLikeEmail = (v) => v.includes('@');
let codeSent = false;
function say(text, kind) { const m = $('forgotMsg'); m.textContent = text; m.className = `form-msg ${kind || ''}`; }
const post = (url, body) => fetchJSON(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

$('email').addEventListener('input', () => { if (codeSent) { codeSent = false; $('resetByCode').hidden = true; $('forgotBtn').textContent = 'Send'; } });

$('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('forgotBtn');
  const who = $('email').value.trim();
  if (!who) { say('Type your phone number or email address.', 'error'); $('email').focus(); return; }
  btn.disabled = true;
  try {
    if (looksLikeEmail(who)) {
      const res = await post('/api/auth/forgot-password', { email: who });
      say(res.message || 'If an account exists for that email, a reset link has been sent.', 'success');
    } else if (!codeSent) {
      const status = await fetchJSON(`/api/auth/sms-status?chapterId=${encodeURIComponent(getSelectedChapterId() || '')}`).catch(() => ({ codes: false }));
      if (!status.codes) {
        say('Resetting by text is not set up for your chapter yet. Type the email address on your account instead, or ask your chapter admin to reset it.', 'error');
      } else {
        const res = await post('/api/auth/sms/request', { phone: who, purpose: 'reset' });
        codeSent = true;
        $('resetByCode').hidden = false;
        btn.textContent = 'Change my password';
        say(res.message, 'success');
        $('resetCode').focus();
      }
    } else {
      if ($('newPassword').value.length < 8) { say('Choose a password of at least 8 characters.', 'error'); $('newPassword').focus(); btn.disabled = false; return; }
      const res = await post('/api/auth/sms/reset', { phone: who, code: $('resetCode').value, newPassword: $('newPassword').value });
      say(res.message, 'success');
      $('resetByCode').hidden = true;
      btn.hidden = true;
      $('forgotMsg').insertAdjacentHTML('afterend', '<p style="text-align:center; margin-top:12px;"><a class="btn btn-primary" href="/login.html">Sign in</a></p>');
    }
  } catch (err) {
    say(err.message || 'Something went wrong. Please try again.', 'error');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
