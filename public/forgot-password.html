<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="site-header"></header>

<section style="padding-top:64px; padding-bottom:64px;">
  <div class="container">
    <form class="form-card" id="forgotForm">
      <img src="/images/logo.jpg" alt="ACONSU" style="width:56px; height:56px; border-radius:50%; margin:0 auto 14px; display:block;">
      <h2 style="text-align:center;">Reset Your Password</h2>
      <p style="text-align:center; color:#5a4468; margin-bottom:24px;">Enter your account email and we'll send you a link to reset your password.</p>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send Reset Link</button>
      <div class="form-msg" id="forgotMsg"></div>
      <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:#5a4468;">
        <a href="/login.html" style="color:var(--purple-deep); font-weight:700;">Back to log in</a>
      </p>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
initLayout('/forgot-password.html');

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('forgotBtn');
  const msg = document.getElementById('forgotMsg');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const res = await fetchJSON('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    msg.textContent = res.message || 'If an account exists for that email, a reset link has been sent.';
    msg.className = 'form-msg success';
    document.getElementById('forgotForm').reset();
  } catch (err) {
    msg.textContent = 'Something went wrong. Please try again.';
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
