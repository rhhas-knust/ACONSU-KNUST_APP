<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Office — ACONSU</title>
<meta name="robots" content="noindex">
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/images/logo.jpg">
<meta name="theme-color" content="#5B2C82">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>

<div class="portal-login-wrap" id="portalLoginWrap" style="display:none;">
  <form class="portal-login-card" id="portalLoginForm">
    <img class="mark" src="/images/logo.jpg" alt="ACONSU">
    <h2>Finance Office</h2>
    <p class="sub">Budgets, the ledger and financial reporting for ACONSU.</p>
    <div class="field">
      <label for="portalUsername">Username</label>
      <input type="text" id="portalUsername" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="portalPassword">Password</label>
      <input type="password" id="portalPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="portalLoginBtn">Sign In</button>
    <div class="form-msg" id="portalLoginMsg"></div>
    <p class="tiny muted" style="text-align:center; margin-top:18px;">Accounts are created by the ACONSU admin.</p>
  </form>
</div>

<div class="portal-shell" id="portalShell">
  <div class="portal-topbar">
    <div class="brand">
      <button class="portal-menu-toggle" id="portalMenuToggle" aria-label="Toggle menu">&#9776;</button>
      <img src="/images/logo.jpg" alt="ACONSU">
      <div>
        <b id="portalBrandName">ACONSU</b>
        <span id="portalRoleLabel"></span>
      </div>
    </div>
    <div class="who">
      <span class="name" id="portalWho"></span>
      <button type="button" class="theme-toggle theme-toggle-onbrand" id="themeToggle" aria-label="Switch between light and dark"></button>
      <button class="btn btn-outline btn-sm" id="portalLogoutBtn" style="color:#fff; border-color:rgba(255,255,255,0.4);">Log Out</button>
    </div>
  </div>
  <div class="portal-layout">
    <div class="portal-side" id="portalNav"></div>
    <div class="portal-main" id="portalMain"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/js/main.js"></script>
<script src="/js/portal.js"></script>
<script src="/js/finance.js"></script>
</body>
</html>
