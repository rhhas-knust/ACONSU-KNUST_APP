<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Content Manager — ACONSU</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/portal.css"></head><body>
<main class="container" style="max-width:900px;padding-top:40px"><a href="/admin.html" class="btn btn-outline btn-sm">← Admin Dashboard</a><div class="panel-head"><div><p class="eyebrow">Publicity &amp; Chapter Content</p><h1>Content Manager</h1><p class="sub">Publish live services, seminars, highlights, e-books and public history content for your chapter.</p></div></div>
<section class="portal-card"><form id="contentForm"><div class="field-row"><div class="field"><label>Content type</label><select id="kind"><option value="live_service">Live service</option><option value="seminar">Seminar</option><option value="weekly_highlight">Weekly highlight</option><option value="ebook">E-book</option><option value="founder">Founder</option><option value="church_info">Church information</option><option value="aconsu_info">ACONSU information</option></select></div><div class="field"><label>Title</label><input id="title" required></div></div><div class="field"><label>Summary</label><input id="summary"></div><div class="field"><label>Full text / description</label><textarea id="body" rows="4"></textarea></div><div class="field-row"><div class="field"><label>Preview / live link</label><input id="previewUrl" type="url" placeholder="https://youtube.com/..."></div><div class="field"><label>Resource / full link</label><input id="resourceUrl" type="url" placeholder="https://..."></div></div><div class="field-row"><div class="field"><label>Category</label><input id="category" placeholder="Leadership, devotional, etc."></div><div class="field"><label>Date</label><input id="eventDate" type="date"></div></div><label><input id="featured" type="checkbox" style="width:auto;margin-right:7px"> Feature this item</label><div style="margin-top:18px"><button class="btn btn-primary">Publish Content</button><span class="form-msg" id="message"></span></div></form></section><section class="portal-card"><h2>Your published content</h2><div class="table-wrap"><table class="portal-table"><thead><tr><th>Type</th><th>Title</th><th>Status</th><th></th></tr></thead><tbody id="items"></tbody></table></div></section></main><script src="/js/main.js"></script><script>
const q=id=>document.getElementById(id); async function load(){try{const items=await fetchJSON('/api/admin/content');q('items').innerHTML=items.map(i=>`<tr><td>${escapeHtml(i.kind.replace('_',' '))}</td><td><strong>${escapeHtml(i.title)}</strong></td><td>${i.published?'Published':'Draft'}</td><td><button data-del="${i.id}" class="danger">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">No content yet.</td></tr>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this content item?')){await fetchJSON('/api/admin/content/'+b.dataset.del,{method:'DELETE'});load();}})}catch(e){q('items').innerHTML='<tr><td colspan="4">You need an authorised staff login to manage content.</td></tr>'}}q('contentForm').onsubmit=async e=>{e.preventDefault();try{await fetchJSON('/api/admin/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:q('kind').value,title:q('title').value,summary:q('summary').value,body:q('body').value,previewUrl:q('previewUrl').value,resourceUrl:q('resourceUrl').value,category:q('category').value,eventDate:q('eventDate').value,featured:q('featured').checked})});q('contentForm').reset();q('message').textContent='Published.';load()}catch(err){q('message').textContent=err.message||'Could not publish.'}};load();</script></body></html>
