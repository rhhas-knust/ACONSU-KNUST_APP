<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Study | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .study-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; cursor:pointer; transition:box-shadow 0.15s ease; }
  .study-card:hover { box-shadow:0 10px 24px rgba(0,0,0,0.12); }
  .study-card h3 { margin:0 0 4px; }
  .study-card .meta { font-size:0.82rem; color:var(--ink-faint); margin-bottom:8px; }
  .study-detail { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px; }
  .study-detail h4 { margin:18px 0 8px; color:var(--brand); }
  .study-detail ul { padding-left:20px; }
  .scripture-link { display:inline-flex; align-items:center; gap:6px; background:var(--lilac-light); color:var(--brand); padding:6px 14px; border-radius:6px; font-weight:700; font-size:0.85rem; text-decoration:none; margin-bottom:10px; }
</style>
</head>

  <div class="hero-content">
    <h1>Bible Study</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:760px;">

    </div>
    <div id="studyDetailView" style="display:none;">

      <div id="studyDetail"></div>
    </div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>

</html>
