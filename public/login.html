<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section style="padding-top:64px; padding-bottom:64px;">
  <div class="container">
    <form class="form-card" id="loginForm" novalidate>
      <img src="/images/logo.jpg" alt="ACONSU" style="width:56px; height:56px; border-radius:50%; margin:0 auto 14px; display:block;">
      <h1 style="text-align:center; font-size:1.8rem;">Welcome back</h1>
      <p style="text-align:center; color:var(--ink-soft); margin-bottom:24px;">Log in to your ACONSU account.</p>
      <div class="field">
        <label for="email">Phone number or email</label>
        <input type="text" id="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="field" id="codeField" hidden>
        <label for="smsCodeInput">The 6-digit code from the text</label>
        <input type="text" id="smsCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
      </div>
      <p style="text-align:right; margin-bottom:16px;"><a href="/forgot-password.html" id="forgotLink" style="font-size:0.85rem; color:var(--brand); font-weight:700;">Forgot password?</a></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <div class="form-msg" id="loginMsg" role="status" aria-live="polite"></div>
      <p class="login-switch" id="codeSwitchWrap" hidden>
        <button type="button" class="photo-signout" id="codeSwitch">Sign in with a code by text instead</button>
      </p>
      <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--ink-soft);">
        Don't have an account? <a href="/register.html" style="color:var(--brand); font-weight:700;">Sign up</a>
      </p>
    </form>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
// Two ways in: the password, or (where the chapter can send texts) a code
// sent to the phone number. The second is offered only where it can work.
let byCode = false;
let codeSent = false;
const $ = (id) => document.getElementById(id);
function say(text, kind) { const m = $('loginMsg'); m.textContent = text; m.className = `form-msg ${kind || ''}`; }
function showMode() {
  $('passwordField').hidden = byCode;
  $('password').required = !byCode;
  $('codeField').hidden = !(byCode && codeSent);
  $('forgotLink').hidden = byCode;
  $('codeSwitch').textContent = byCode ? 'Sign in with my password instead' : 'Sign in with a code by text instead';
  document.querySelector('label[for="email"]').textContent = byCode ? 'Your phone number' : 'Phone number or email';
  $('loginBtn').textContent = !byCode ? 'Log In' : codeSent ? 'Sign in' : 'Send me a code';
}

(async function () {
  const authRes = await fetchJSON('/api/auth/me').catch(() => ({ member: null }));
  if (authRes.member) { window.location.href = '/profile.html'; return; }
  await initLayout('/login.html');
  const status = await fetchJSON(`/api/auth/sms-status?chapterId=${encodeURIComponent(getSelectedChapterId() || '')}`).catch(() => ({ codes: false }));
  $('codeSwitchWrap').hidden = !status.codes;
})();

$('codeSwitch').addEventListener('click', () => { byCode = !byCode; codeSent = false; say(''); showMode(); });

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  if (byCode) {
    const post = (url, body) => fetchJSON(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    btn.disabled = true;
    try {
      if (!codeSent) {
        const out = await post('/api/auth/sms/request', { phone: $('email').value, purpose: 'signin' });
        codeSent = true; showMode();
        say(out.message, 'success');
        $('smsCodeInput').focus();
      } else {
        const out = await post('/api/auth/sms/signin', { phone: $('email').value, code: $('smsCodeInput').value });
        window.location.href = out.needsPhoto ? '/photo.html' : '/profile.html';
        return;
      }
    } catch (err) { say(err.message || 'Could not sign you in.', 'error'); }
    btn.disabled = false;
    return;
  }
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    await fetchJSON('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        identifier: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    }).then((out) => {
      // Signed up but never added a photo: that comes first.
      if (out && out.needsPhoto) { window.location.href = '/photo.html'; return new Promise(() => {}); }
      return out;
    });
    showToast('Welcome back!', 'success');
    window.location.href = '/profile.html';
  } catch (err) {
    msg.textContent = err.message || 'Could not log in.';
    msg.className = 'form-msg error';
    btn.disabled = false; btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
