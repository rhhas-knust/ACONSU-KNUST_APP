<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section style="padding-top:64px; padding-bottom:64px;">
  <div class="container">
    <form class="form-card" id="loginForm" novalidate>
      <img src="/images/logo.jpg" alt="ACONSU" style="width:56px; height:56px; border-radius:50%; margin:0 auto 14px; display:block;">
      <h1 style="text-align:center; font-size:1.8rem;">Welcome back</h1>
      <p style="text-align:center; color:var(--ink-soft); margin-bottom:24px;">Log in to your ACONSU account.</p>
      <div class="field">
        <label for="email">Phone number or email</label>
        <input type="text" id="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="field" id="codeField" hidden>
        <label for="smsCodeInput">The 6-digit code from the text</label>
        <input type="text" id="smsCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
      </div>
      <p style="text-align:right; margin-bottom:16px;"><a href="/forgot-password.html" id="forgotLink" style="font-size:0.85rem; color:var(--brand); font-weight:700;">Forgot password?</a></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <div class="form-msg" id="loginMsg" role="status" aria-live="polite"></div>
      <p class="login-switch" id="codeSwitchWrap" hidden>
        <button type="button" class="photo-signout" id="codeSwitch">Sign in with a code by text instead</button>
      </p>
      <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--ink-soft);">
        Don't have an account? <a href="/register.html" style="color:var(--brand); font-weight:700;">Sign up</a>
      </p>
    </form>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
