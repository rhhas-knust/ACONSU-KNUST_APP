<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Wall — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .prayer-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .prayer-card p.request-text { margin:8px 0 12px; color:var(--purple-ink); line-height:1.5; }
  .prayer-card .row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .prayer-card .who { font-weight:700; font-size:0.85rem; color:var(--purple-deep); }
  .pray-btn { border:2px solid var(--purple-deep); background:#fff; color:var(--purple-deep); border-radius:999px; padding:7px 16px; font-weight:700; font-size:0.82rem; cursor:pointer; }
  .pray-btn.done { background:var(--purple-deep); color:#fff; }
  .pray-count { font-size:0.78rem; color:#8a7595; }
  .answered-badge { display:inline-block; background:#D9F0DE; color:#2E7D4F; font-size:0.72rem; font-weight:800; padding:3px 10px; border-radius:999px; margin-bottom:8px; }
  .testimony-box { background:var(--lilac-light); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:0.85rem; font-style:italic; color:#5a4468; }
  .mine-actions { margin-top:10px; }
</style>
</head>
<body>

<header id="site-header"></header>

<section class="hero" style="padding-bottom:48px;">
  <div class="hero-flame"></div>
  <div class="hero-content">
    <p class="eyebrow">You're Not Alone</p>
    <h1>Prayer Wall</h1>
    <p class="lede">Bring whatever you're carrying. We would love to stand in prayer with you.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container">
    <form class="form-card" id="prayerForm">
      <div class="field">
        <label for="name">Name (optional — you can stay anonymous)</label>
        <input type="text" id="name" placeholder="Anonymous">
      </div>
      <div class="field">
        <label for="email">Email (optional, if you'd like a follow-up)</label>
        <input type="email" id="email">
      </div>
      <div class="field">
        <label for="request">Your Prayer Request</label>
        <textarea id="request" required placeholder="Share as much or as little as you'd like"></textarea>
      </div>
      <div class="field">
        <label for="visibility">Who should see this?</label>
        <select id="visibility">
          <option value="private">Only leaders (private)</option>
          <option value="shepherd_only">Only the Shepherding team</option>
          <option value="public">The Prayer Wall — with my name</option>
          <option value="anonymous">The Prayer Wall — anonymously</option>
        </select>
      </div>
      <button type="submit" class="btn btn-flame btn-block" id="prayerSubmitBtn">Submit Prayer Request</button>
      <div class="form-msg" id="prayerMsg"></div>
    </form>
  </div>
</section>

<section class="alt-bg">
  <div class="container" style="max-width:700px;">
    <div class="section-head">
      <p class="eyebrow">Standing Together</p>
      <h2>The Prayer Wall</h2>
      <p class="lede">Requests shared publicly by the community. Tap to let someone know you're praying for them.</p>
    </div>
    <div id="prayerWallList" style="display:grid; gap:14px; margin-bottom:48px;">
      <p class="empty-state">Loading...</p>
    </div>
  </div>
</section>

<section class="alt-bg">
  <div class="container" style="max-width:700px;">
    <div class="section-head">
      <p class="eyebrow">Testimonies</p>
      <h2>Share What God Has Done</h2>
    </div>
    <form class="form-card" id="testimonyForm" style="margin-bottom:48px;">
      <div class="field">
        <label for="tName">Name (optional)</label>
        <input type="text" id="tName" placeholder="Anonymous">
      </div>
      <div class="field">
        <label for="tTestimony">Your Testimony</label>
        <textarea id="tTestimony" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="testimonySubmitBtn">Share Testimony</button>
      <div class="form-msg" id="testimonyMsg"></div>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
let currentMember = null;

async function loadPrayerWall() {
  const list = document.getElementById('prayerWallList');
  try {
    const items = await fetchJSON('/api/prayer-wall');
    if (!items.length) {
      list.innerHTML = '<p class="empty-state">No public prayer requests right now — be the first to share one above.</p>';
      return;
    }
    list.innerHTML = items.map((p) => `
      <div class="prayer-card" data-id="${p.id}">
        ${p.answered ? '<span class="answered-badge">🙌 Answered</span>' : ''}
        <p class="request-text">${escapeHtml(p.request)}</p>
        <div class="row">
          <span class="who">— ${escapeHtml(p.name || 'Anonymous')}</span>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="pray-count">${p.prayingCount} praying</span>
            <button type="button" class="pray-btn" data-pray="${p.id}">🙏 I'm praying</button>
          </div>
        </div>
        ${p.testimony ? `<div class="testimony-box">"${escapeHtml(p.testimony)}"</div>` : ''}
        ${p.isMine && !p.answered ? `
          <div class="mine-actions">
            <button type="button" class="btn btn-outline btn-sm" data-mark-answered="${p.id}">Mark as answered</button>
          </div>
        ` : ''}
      </div>
    `).join('');

    list.querySelectorAll('[data-pray]').forEach(btn => btn.addEventListener('click', async () => {
      if (!currentMember) { showToast('Log in to let them know you\'re praying.', 'error'); return; }
      try {
        await fetchJSON(`/api/prayer-requests/${btn.dataset.pray}/pray`, { method: 'POST' });
        btn.classList.add('done');
        btn.textContent = '🙏 Praying';
        showToast('They\'ll be encouraged to know you\'re praying.', 'success');
      } catch (err) { showToast(err.message || 'Could not record this.', 'error'); }
    }));
    list.querySelectorAll('[data-mark-answered]').forEach(btn => btn.addEventListener('click', async () => {
      const testimony = prompt('Want to share how God answered this? (optional — leave blank to skip)');
      try {
        await fetchJSON(`/api/prayer-requests/${btn.dataset.markAnswered}/answered`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ testimony: testimony || '' })
        });
        showToast('Marked as answered — thank you for sharing!', 'success');
        loadPrayerWall();
      } catch (err) { showToast(err.message || 'Could not update this.', 'error'); }
    }));
  } catch (e) {
    list.innerHTML = '<p class="empty-state">Could not load the prayer wall right now.</p>';
  }
}

(async function () {
  await initLayout('/prayer.html');
  const authRes = await fetchJSON('/api/auth/me').catch(() => ({ member: null }));
  currentMember = authRes.member;
  loadPrayerWall();
})();

document.getElementById('prayerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('prayerSubmitBtn');
  const msg = document.getElementById('prayerMsg');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetchJSON('/api/prayer-requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        request: document.getElementById('request').value,
        visibility: document.getElementById('visibility').value
      })
    });
    msg.textContent = 'We received your request — the prayer team is praying with you.';
    msg.className = 'form-msg success';
    showToast('Prayer request received — praying with you.', 'success');
    document.getElementById('prayerForm').reset();
    loadPrayerWall();
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong. Please try again.';
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit Prayer Request';
  }
});

document.getElementById('testimonyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('testimonySubmitBtn');
  const msg = document.getElementById('testimonyMsg');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetchJSON('/api/testimonies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('tName').value,
        testimony: document.getElementById('tTestimony').value
      })
    });
    msg.textContent = 'Thank you for sharing! It will be reviewed before appearing publicly.';
    msg.className = 'form-msg success';
    showToast('Thank you for sharing your testimony!', 'success');
    document.getElementById('testimonyForm').reset();
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong. Please try again.';
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Share Testimony';
  }
});
</script>
</body>
</html>
