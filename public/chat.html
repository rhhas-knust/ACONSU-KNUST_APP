<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .topic-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .topic-card:hover { box-shadow:0 8px 20px rgba(0,0,0,0.1); }
  .chat-message { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .chat-message .who { font-weight:700; font-size:0.85rem; color:var(--brand); }
  .chat-message .when { font-size:0.74rem; color:var(--ink-faint); }
  .chat-message .actions { margin-top:6px; }
  .chat-message .actions button { background:none; border:none; color:var(--ink-faint); font-size:0.75rem; cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero" data-art="gather" data-hero-page="chat">
  <div class="hero-content">
    <h1>Community</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:700px;">
    <div id="topicListView">
      <button class="btn btn-primary btn-sm" id="newTopicBtn" style="margin-bottom:18px;">+ Start a Discussion</button>
      <div id="topicList"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>
    </div>
    <div id="topicDetailView" style="display:none;">
      <button class="btn btn-outline btn-sm" id="backToTopicsBtn" style="margin-bottom:16px;">&larr; All Discussions</button>
      <h2 id="topicTitle"></h2>
      <div id="messagesList" style="margin:16px 0;"></div>
      <form id="messageForm">
        <textarea id="messageBody" rows="2" placeholder="Add to the discussion..." style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit;"></textarea>
        <button type="submit" class="btn btn-primary btn-sm" style="margin-top:8px;">Send</button>
      </form>
    </div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/chat.js"></script>
</body>
</html>
