<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sermon Notes | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .note-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .note-card h4 { margin:0 0 4px; }
  .note-card .meta { font-size:0.8rem; color:var(--ink-faint); margin-bottom:10px; }
  .note-card .body-text { white-space:pre-wrap; font-size:0.92rem; line-height:1.55; color:var(--ink); }
  .note-card .row-actions { margin-top:12px; display:flex; gap:8px; }
  .note-card .row-actions button { border:none; background:var(--lilac-mid); color:var(--brand-strong); padding:6px 12px; border-radius:7px; font-size:0.78rem; font-weight:700; cursor:pointer; }
  .note-card .row-actions button.danger { background:var(--bad-bg); color:var(--bad-ink); }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section style="padding-top:48px;">
  <div class="container" style="max-width:720px;">
    <div class="section-head">
      <h1>My Sermon Notes</h1>
      <p class="lede">Private to you. Save what stood out and come back to it anytime.</p>
    </div>
    <button class="btn btn-primary" id="newNoteBtn" style="margin-bottom:24px;">+ New Sermon Note</button>
    <div id="notesList"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<div class="modal-backdrop" id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(36,21,48,0.55); align-items:center; justify-content:center; padding:20px; z-index:200;">
  <div class="modal" id="modalContent" style="background:var(--surface); border-radius:16px; padding:26px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto;"></div>
</div>

<script src="/js/main.js"></script>
<script src="/js/pages/sermon-notes.js"></script>
</body>
</html>
