<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<section class="hero" data-art="calm" data-hero-page="not-found">
  <div class="hero-content">
    <p class="eyebrow">404</p>
    <h1>We couldn't find that page</h1>
    <p class="lede">Let's get you back home.</p>
    <a href="/index.html" class="btn btn-primary">Back to Home</a>
  </div>
</section>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>initLayout('');</script>
</body>
</html>
