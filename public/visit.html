<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Your Visit | ACONSU</title>
<meta name="description" content="When ACONSU meets, where to find us, and what to expect on your first visit.">
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<!-- A first-time visitor's three questions, answered in the order they ask
     them: when do you meet, where, and what will it be like. Everything here
     comes from the chapter's own settings; a part with nothing to say is left
     out rather than filled with a guess. -->
<section class="hero" data-art="dawn" data-hero-page="visit">
  <div class="hero-content">
    <h1>Plan your visit</h1>
    <p class="lede" id="visitLede">New here? You are welcome. Here is when we meet, where to find us, and what to expect.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container visit-grid">

    <article class="visit-card" aria-labelledby="whenHead">
      <span class="visit-icon" id="whenIcon" aria-hidden="true"></span>
      <h2 id="whenHead">When we meet</h2>
      <ul class="visit-times" id="visitTimes"></ul>
    </article>

    <article class="visit-card" aria-labelledby="whereHead" id="whereCard">
      <span class="visit-icon" id="whereIcon" aria-hidden="true"></span>
      <h2 id="whereHead">Where to find us</h2>
      <p class="visit-place" id="visitPlace"></p>
      <p class="visit-address" id="visitAddress"></p>
      <div id="visitMap"></div>
    </article>

    <article class="visit-card visit-wide" aria-labelledby="expectHead">
      <span class="visit-icon" id="expectIcon" aria-hidden="true"></span>
      <h2 id="expectHead">What to expect</h2>
      <div id="visitExpect"></div>
    </article>

    <article class="visit-card visit-wide" aria-labelledby="askHead">
      <h2 id="askHead">Questions before you come?</h2>
      <p>Message us and someone from the chapter will answer.</p>
      <div class="visit-actions" id="visitContact"></div>
    </article>

    <article class="visit-card visit-wide" aria-labelledby="nextHead" id="nextCard" hidden>
      <h2 id="nextHead">Coming up</h2>
      <div id="visitNext"></div>
      <a href="/events.html" class="btn btn-outline">All events</a>
    </article>

  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/visit.js"></script>
</body>
</html>
