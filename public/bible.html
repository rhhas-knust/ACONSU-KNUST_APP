<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read the Bible | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero hero-compact" data-art="word" data-hero-page="bible">
  <div class="hero-content">
    <h1>Read the Bible</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:800px;">

    <div class="reader-bar">
      <div class="reader-pickers">
        <select id="bookSelect" aria-label="Book"></select>
        <select id="chapterSelect" aria-label="Chapter"></select>
        <select id="translationSelect" class="version" aria-label="Version"></select>
      </div>

      <div class="reader-tools">
        <div class="tool-group" role="group" aria-label="Text size">
          <button class="tool-btn" id="fontDownBtn" title="Smaller text" aria-label="Smaller text">A&minus;</button>
          <button class="tool-btn" id="fontUpBtn" title="Larger text" aria-label="Larger text">A+</button>
        </div>

        <div class="tool-group" id="themeGroup" role="group" aria-label="Reading theme">
          <button class="tool-btn" data-theme="day" aria-pressed="true">Day</button>
          <button class="tool-btn" data-theme="sepia" aria-pressed="false">Sepia</button>
          <button class="tool-btn" data-theme="night" aria-pressed="false">Night</button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="flowBtn" aria-pressed="false" aria-label="Read as flowing paragraphs"
                  title="Read as flowing paragraphs instead of one verse per line">&para;<span class="t-label">Flow</span></button>
        </div>

        <span class="spacer"></span>

        <div class="tool-group">
          <button class="tool-btn" id="downloadChapterBtn" aria-label="Save this chapter"
                  title="Save this chapter to your device">&darr;<span class="t-label">Save</span></button>
        </div>
      </div>
    </div>

    <div id="verseWrap">
      <div class="skeleton skeleton-card" style="height:320px;"></div>
    </div>

    <div class="bible-nav-btns">
      <button class="btn btn-outline btn-sm" id="prevChapterBtn">&larr; Previous</button>
      <button class="btn btn-outline btn-sm" id="nextChapterBtn">Next &rarr;</button>
    </div>

    <div class="bible-download-hint" id="fullVersionHint" hidden>
      <p style="margin-bottom:10px; color:var(--ink-soft);">Looking for a full offline copy of a Bible version?</p>
      <a href="#" id="fullVersionLink" class="btn btn-outline btn-sm">Browse Downloadable Versions</a>
    </div>
  </div>
</section>

<div class="verse-action-bar" id="verseActions" hidden>
  <button id="copyVerseBtn">Copy</button>
  <button id="shareVerseBtn">Share</button>
  <button id="imageVerseBtn">Image</button>
</div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/bible.js"></script>
</body>
</html>
