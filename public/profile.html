<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .profile-photo { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 3px solid var(--lilac-mid); background: var(--lilac-light); display:flex; align-items:center; justify-content:center; margin: 0 auto 12px; }
  .profile-photo img { width:100%; height:100%; object-fit:cover; }
  .profile-photo .initial { font-family: var(--font-display); font-size: 1.8rem; color: var(--purple-deep); }
  .profile-tabs { display:flex; gap:10px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .profile-tabs button { background:none; border:2px solid var(--line); border-radius:999px; padding:8px 18px; font-weight:700; font-size:0.85rem; cursor:pointer; color:var(--purple-ink); }
  .profile-tabs button.active { border-color: var(--purple-deep); background: var(--purple-deep); color: #fff; }

  /* ---------- redesigned profile header ---------- */
  .profile-top-row { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
  .profile-name h1 { font-size:1.7rem; margin-bottom:4px; }
  .profile-avatar-wrap { position:relative; flex:none; }
  .profile-avatar { width:76px; height:76px; border-radius:50%; overflow:hidden; border:3px solid var(--lilac-mid); background:var(--lilac-light); display:flex; align-items:center; justify-content:center; }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .initial { font-family:var(--font-display); font-size:1.6rem; color:var(--purple-deep); }
  .avatar-camera-btn { position:absolute; bottom:-2px; right:-2px; width:28px; height:28px; border-radius:50%; background:var(--purple-deep); color:#fff; border:2px solid #fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.85rem; }
  .quick-pills { display:flex; gap:10px; margin-bottom:22px; }
  .quick-pill { flex:1; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; text-decoration:none; color:var(--purple-ink); font-size:0.78rem; font-weight:700; }
  .quick-pill .qp-icon { font-size:1.3rem; display:block; margin-bottom:4px; }
  .streak-card { background:linear-gradient(120deg, var(--flame-gold), var(--flame-red)); border-radius:16px; padding:20px; color:#fff; display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .streak-card .streak-num { font-family:var(--font-display); font-size:2rem; font-weight:700; }
  .badges-section h3 { margin-bottom:14px; }
  .badges-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:14px; margin-bottom:28px; }
  .badge-item { text-align:center; }
  .badge-circle { width:56px; height:56px; border-radius:50%; background:var(--lilac-light); display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 6px; opacity:0.35; filter:grayscale(1); }
  .badge-circle.earned { opacity:1; filter:none; background:linear-gradient(135deg, var(--flame-gold), var(--flame-red)); box-shadow:0 6px 16px rgba(232,151,30,0.35); }
  .badge-label { font-size:0.68rem; font-weight:700; color:#5a4468; line-height:1.2; }
</style>
</head>
<body>

<header id="site-header"></header>

<section style="padding-top:32px; padding-bottom:64px;">
  <div class="container" style="max-width:560px;">
    <div id="profileTopRow">
      <p class="empty-state">Loading your profile...</p>
    </div>

    <div id="quickPills"></div>
    <div id="streakCardWrap"></div>

    <div class="badges-section">
      <h3>Badges</h3>
      <div class="badges-grid" id="badgesGrid">
        <div class="skeleton skeleton-card" style="height:80px;"></div>
      </div>
    </div>

    <h3 style="margin-bottom:14px;">Account Settings</h3>
    <div class="profile-tabs">
      <button data-tab="details" class="active">My Details</button>
      <button data-tab="password">Change Password</button>
    </div>

    <form class="form-card" id="detailsForm">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" disabled style="opacity:0.6;">
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone">
      </div>
      <div class="field">
        <label for="level">Level / Year of Study</label>
        <input type="text" id="level">
      </div>
      <div class="field">
        <label>Birthday (month &amp; day only — no year is ever stored)</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <select id="birthdayMonth">
            <option value="">Month</option>
            <option value="1">January</option><option value="2">February</option><option value="3">March</option>
            <option value="4">April</option><option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option><option value="9">September</option>
            <option value="10">October</option><option value="11">November</option><option value="12">December</option>
          </select>
          <select id="birthdayDay">
            <option value="">Day</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="profileImage">Profile Photo</label>
        <input type="file" id="profileImage" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="detailsSubmitBtn">Save Changes</button>
      <div class="form-msg" id="detailsMsg"></div>
    </form>

    <form class="form-card" id="passwordForm" style="display:none;">
      <div class="field">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" required>
      </div>
      <div class="field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="passwordSubmitBtn">Update Password</button>
      <div class="form-msg" id="passwordMsg"></div>
    </form>

    <div style="text-align:center; margin-top:24px;">
      <button class="btn btn-outline btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
let CURRENT_MEMBER = null;

(async function () {
  const authRes = await fetchJSON('/api/auth/me').catch(() => ({ member: null }));
  if (!authRes.member) { window.location.href = '/login.html'; return; }
  CURRENT_MEMBER = authRes.member;
  await initLayout('/profile.html');
  renderProfileTopRow();
  renderQuickPills();
  fillDetailsForm();
  loadBadgesAndStreak();
})();

function renderProfileTopRow() {
  const el = document.getElementById('profileTopRow');
  const m = CURRENT_MEMBER;
  el.innerHTML = `
    <div class="profile-top-row">
      <div class="profile-name">
        <h1>${escapeHtml(m.name)}</h1>
        <p style="color:#5a4468; margin:0;">${escapeHtml(m.email)}</p>
      </div>
      <div class="profile-avatar-wrap">
        <div class="profile-avatar">
          ${m.profileImageFileId ? `<img src="/api/files/${m.profileImageFileId}" alt="${escapeHtml(m.name)}">` : `<span class="initial">${escapeHtml((m.name || '?').charAt(0))}</span>`}
        </div>
        <label class="avatar-camera-btn" for="profileImage" title="Change photo">📷</label>
      </div>
    </div>
  `;
}

function renderQuickPills() {
  document.getElementById('quickPills').innerHTML = `
    <div class="quick-pills">
      <a href="/events.html" class="quick-pill"><span class="qp-icon">🎟️</span>My Events</a>
      <a href="/prayer.html" class="quick-pill"><span class="qp-icon">🙏</span>Prayer Wall</a>
      <a href="/departments.html" class="quick-pill"><span class="qp-icon">🤝</span>Departments</a>
    </div>
  `;
}

async function loadBadgesAndStreak() {
  try {
    const data = await fetchJSON('/api/member/badges');
    document.getElementById('streakCardWrap').innerHTML = `
      <div class="streak-card">
        <div>
          <div style="font-size:0.8rem; opacity:0.9; font-weight:700;">App Streak</div>
          <div class="streak-num">${data.currentStreak} day${data.currentStreak === 1 ? '' : 's'}</div>
        </div>
        <div style="text-align:right; font-size:0.8rem; opacity:0.9;">
          Longest: ${data.longestStreak} day${data.longestStreak === 1 ? '' : 's'}<br>
          ${data.bibleChaptersRead} chapters read
        </div>
      </div>
    `;
    document.getElementById('badgesGrid').innerHTML = data.badges.map(b => `
      <div class="badge-item">
        <div class="badge-circle ${b.earned ? 'earned' : ''}">${b.icon}</div>
        <div class="badge-label">${escapeHtml(b.label)}</div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('badgesGrid').innerHTML = '<p class="empty-state">Could not load badges.</p>';
  }
}

function fillDetailsForm() {
  document.getElementById('name').value = CURRENT_MEMBER.name || '';
  document.getElementById('email').value = CURRENT_MEMBER.email || '';
  document.getElementById('phone').value = CURRENT_MEMBER.phone || '';
  document.getElementById('level').value = CURRENT_MEMBER.level || '';
  const daySelect = document.getElementById('birthdayDay');
  for (let d = 1; d <= 31; d++) {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    daySelect.appendChild(opt);
  }
  if (CURRENT_MEMBER.birthdayMonth) document.getElementById('birthdayMonth').value = CURRENT_MEMBER.birthdayMonth;
  if (CURRENT_MEMBER.birthdayDay) document.getElementById('birthdayDay').value = CURRENT_MEMBER.birthdayDay;
}

document.querySelectorAll('.profile-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.profile-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('detailsForm').style.display = btn.dataset.tab === 'details' ? 'block' : 'none';
    document.getElementById('passwordForm').style.display = btn.dataset.tab === 'password' ? 'block' : 'none';
  });
});

document.getElementById('profileImage').addEventListener('change', (e) => {
  if (e.target.files.length) document.getElementById('detailsForm').requestSubmit();
});

document.getElementById('detailsForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('detailsSubmitBtn');
  const msg = document.getElementById('detailsMsg');
  btn.disabled = true; btn.textContent = 'Saving...';
  const formData = new FormData();
  formData.append('name', document.getElementById('name').value);
  formData.append('phone', document.getElementById('phone').value);
  formData.append('level', document.getElementById('level').value);
  formData.append('birthdayMonth', document.getElementById('birthdayMonth').value);
  formData.append('birthdayDay', document.getElementById('birthdayDay').value);
  const fileInput = document.getElementById('profileImage');
  if (fileInput.files.length) formData.append('profileImage', fileInput.files[0]);
  try {
    const res = await fetch('/api/member/profile', { method: 'PUT', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save');
    CURRENT_MEMBER = data.member;
    renderProfileTopRow();
    msg.textContent = 'Profile updated.';
    msg.className = 'form-msg success';
    showToast('Profile updated.', 'success');
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
});

document.getElementById('passwordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('passwordSubmitBtn');
  const msg = document.getElementById('passwordMsg');
  btn.disabled = true; btn.textContent = 'Updating...';
  try {
    await fetchJSON('/api/member/password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: document.getElementById('newPassword').value
      })
    });
    msg.textContent = 'Password updated.';
    msg.className = 'form-msg success';
    showToast('Password updated.', 'success');
    document.getElementById('passwordForm').reset();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetchJSON('/api/auth/logout', { method: 'POST' });
  window.location.href = '/index.html';
});
</script>
</body>
</html>
