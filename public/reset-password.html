<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="site-header"></header>

<section style="padding-top:64px; padding-bottom:64px;">
  <div class="container">
    <form class="form-card" id="resetForm">
      <img src="/images/logo.jpg" alt="ACONSU" style="width:56px; height:56px; border-radius:50%; margin:0 auto 14px; display:block;">
      <h2 style="text-align:center;">Set a New Password</h2>
      <div class="field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" minlength="6" required>
        <small class="hint" style="color:#8a7595;">At least 6 characters.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset Password</button>
      <div class="form-msg" id="resetMsg"></div>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
initLayout('/reset-password.html');

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const email = params.get('email');

if (!token || !email) {
  document.getElementById('resetForm').innerHTML = '<p class="empty-state">This reset link is invalid. Please request a new one from the <a href="/forgot-password.html">forgot password page</a>.</p>';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('resetBtn');
  const msg = document.getElementById('resetMsg');
  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    await fetchJSON('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, email, newPassword: document.getElementById('newPassword').value })
    });
    showToast('Password reset — please log in.', 'success');
    window.location.href = '/login.html';
  } catch (err) {
    msg.textContent = err.message || 'Could not reset password.';
    msg.className = 'form-msg error';
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
