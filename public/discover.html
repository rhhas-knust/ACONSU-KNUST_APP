<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .discover-search { width:100%; max-width:100%; box-sizing:border-box; padding:14px 18px; border-radius:6px; border:1.5px solid var(--line); font-family:var(--font-body); font-size:0.95rem; background:var(--surface); color:var(--ink); margin-bottom:22px; }
  .discover-search::placeholder { color:var(--ink-faint); opacity:1; }
  .discover-search:focus { outline:none; border-color:var(--brand); }
  .discover-status { margin:-10px 0 18px; color:var(--ink-soft); font-size:0.9rem; }
  /* minmax(0, 1fr), not 1fr: a column that cannot go below the width of its longest word pushed the tiles past the screen edge on a phone. */
  .discover-tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:28px; }
  .discover-tile { min-width:0; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 16px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:12px; font-weight:700; }
  .discover-tile .dt-icon { width:40px; height:40px; border-radius:12px; background:var(--purple-deep); display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  .discover-tile .dt-icon svg { width:20px; height:20px; }
  .discover-summary { margin-bottom:18px; padding:14px 16px; border-radius:14px; background:rgba(91,44,130,0.06); color:var(--ink); }
  .discover-group { margin-bottom:20px; }
  .discover-group h3 { margin:0 0 10px; font-size:1rem; }
  .discover-result { display:block; padding:14px 4px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; }
  .discover-result:hover { background:rgba(91,44,130,0.03); }
  .discover-result .dr-type { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--flame-gold); font-weight:800; }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section style="padding-top:32px;">
  <div class="container" style="max-width:640px;">
    <h1 style="margin-bottom:16px;">Discover</h1>
    <input type="text" class="discover-search" id="searchInput" placeholder="Search sermons, departments, events...">
    <div class="discover-status" id="searchStatus">Type at least 2 characters to search across sermons, events, pages, and resources.</div>

    <div id="searchResults" style="display:none;"></div>

    <div id="browseSection">
      <div class="discover-tiles" id="discoverTiles"></div>

      <h2 style="margin-bottom:14px; font-size:1.2rem;">Latest sermons</h2>
      <div id="sermonPreview" style="margin-bottom:8px;">
        <div class="skeleton skeleton-card" style="height:90px; margin-bottom:10px;"></div>
      </div>
    </div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/discover.js"></script>
</body>
</html>
