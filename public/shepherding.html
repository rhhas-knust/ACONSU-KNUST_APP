<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shepherding Portal — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { background: var(--lilac-light); }
  .shep-shell { display: none; }
  .shep-topbar { background: var(--purple-rich); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .shep-topbar .brand { display:flex; align-items:center; gap:10px; font-family: var(--font-display); font-weight:700; }
  .shep-topbar .brand img { width:34px; height:34px; border-radius:50%; }
  .shep-layout { display: flex; min-height: calc(100vh - 64px); }
  .shep-side { width: 220px; background: #fff; border-right: 1px solid var(--line); padding: 20px 0; flex: none; }
  .shep-side button { display: block; width: 100%; text-align: left; padding: 12px 24px; background: none; border: none; font-weight: 700; font-size: 0.92rem; color: var(--purple-ink); cursor: pointer; border-left: 3px solid transparent; }
  .shep-side button:hover { background: var(--lilac-light); }
  .shep-side button.active { border-left-color: var(--flame-gold); color: var(--purple-deep); background: var(--lilac-light); }
  .shep-main { flex: 1; padding: 32px; overflow-x: auto; }
  .shep-panel { display: none; }
  .shep-panel.active { display: block; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 0.88rem; vertical-align: top; }
  th { background: var(--lilac-light); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; color: var(--purple-deep); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .row-actions { display: flex; gap: 8px; }
  .row-actions button { border: none; background: var(--lilac-mid); color: var(--purple-rich); padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .row-actions button.danger { background: #FBDFDA; color: var(--flame-red); }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(36,21,48,0.5); align-items: center; justify-content: center; padding: 20px; z-index: 200; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 28px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; }
  .upload-form { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:24px; }
  .upload-form .field-row { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); }
  .summary-cards { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); margin-bottom:28px; }
  .summary-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .summary-card .eyebrow { color: var(--flame-gold); }
  .summary-card h2 { margin: 6px 0 0; font-size: 1.6rem; }
  .summary-card.income h2 { color: #2E7D4F; }
  .summary-card.expense h2 { color: var(--flame-red); }
  .summary-card.balance h2 { color: var(--purple-deep); }
  .status-pill { padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: var(--lilac-mid); color: var(--purple-rich); text-transform: capitalize; }
  .status-pill.regular { background:#D9F0DE; color:#2E7D4F; }
  .status-pill.irregular { background:#FCE9C9; color:#A9670E; }
  .status-pill.inactive { background:#FBDFDA; color: var(--flame-red); }
  .member-thumb { width:36px; height:36px; border-radius:50%; overflow:hidden; background: var(--lilac-light); display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; margin-right:8px; font-weight:700; color:var(--purple-deep); }
  .member-thumb img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <form class="form-card" id="loginForm">
    <img src="/images/logo.jpg" alt="ACONSU" style="width:64px; height:64px; border-radius:50%; margin:0 auto 16px; display:block;">
    <h2 style="text-align:center;">Shepherding Portal</h2>
    <p style="text-align:center; color:#5a4468; margin-bottom:20px; font-size:0.9rem;">Restricted to the Shepherding Head.</p>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
    <div class="form-msg" id="loginMsg"></div>
  </form>
</div>

<div class="shep-shell" id="shepShell">
  <div class="shep-topbar">
    <div class="brand"><img src="/images/logo.jpg" alt="ACONSU"><span>ACONSU Shepherding</span></div>
    <button class="btn btn-outline btn-sm" id="logoutBtn" style="color:#fff; border-color:rgba(255,255,255,0.4);">Log Out</button>
  </div>
  <div class="shep-layout">
    <div class="shep-side" id="shepNav">
      <button data-panel="overview" class="active">Overview</button>
      <button data-panel="members">Members</button>
      <button data-panel="finance">Finance</button>
    </div>
    <div class="shep-main" id="shepMain">
      <div class="shep-panel active" id="panel-overview"></div>
      <div class="shep-panel" id="panel-members"></div>
      <div class="shep-panel" id="panel-finance"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/js/main.js"></script>
<script src="/js/shepherd.js"></script>
</body>
</html>
