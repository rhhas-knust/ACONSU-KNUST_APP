<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<style>
  .pay-details { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:24px; }
  .pay-details dt { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-top:12px; }
  .pay-details dt:first-child { margin-top:0; }
  .pay-details dd { margin:2px 0 0; font-weight:700; font-size:1.05rem; color:var(--brand); }
  .give-history-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero" data-art="harvest" data-hero-page="give">
  <div class="hero-content">
    <h1>Give</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:640px;">
    <div id="payInfo"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>

    <form class="form-card" id="giveForm" style="display:none;">
      <h2 style="margin-bottom:6px; font-size:1.2rem;">Log your gift</h2>
      <p style="font-size:0.85rem; color:var(--ink-faint); margin-bottom:18px;">After sending via MoMo/bank using the details above, tell us here: Finance confirms it against the books.</p>
      <div class="field"><label for="amount">Amount (GH₵)</label><input type="number" id="amount" min="0.01" step="0.01" required></div>
      <div class="field"><label for="purpose">Purpose</label>
        <select id="purpose">
          <option value="tithe">Tithe</option><option value="offertory">Offertory</option>
          <option value="harvest">Harvest</option><option value="momo">General (MoMo)</option><option value="other">Other</option>
        </select>
      </div>
      <div class="field"><label for="method">How did you send it?</label>
        <select id="method"><option value="momo">Mobile Money</option><option value="bank">Bank Transfer</option><option value="cash">Cash</option><option value="other">Other</option></select>
      </div>
      <div class="field"><label for="reference">Transaction reference (optional)</label><input type="text" id="reference" placeholder="MoMo transaction ID, if you have it"></div>
      <p class="form-notice">Sent a wrong amount? Read <a href="/refunds.html">Giving and refunds</a>.</p>
      <button type="submit" class="btn btn-flame btn-block" id="giveSubmitBtn">Submit</button>
      <div class="form-msg" id="giveMsg"></div>
    </form>

    <div class="section-head" style="margin-top:40px;">
      <h2>History</h2>
    </div>
    <div id="giveHistory"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
// The raw keys are not English, and a badge reading "confirmed" is not an
// acknowledgement. Somebody who gave wants to know it arrived, who says so and
// when - so the row says that in words.
const PURPOSE_LABELS = {
  tithe: 'Tithe', offertory: 'Offertory', harvest: 'Harvest',
  momo: 'General giving', other: 'Other'
};
const niceDate = (d) => {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? String(d) : dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};

function giveStatusLine(g) {
  if (g.status === 'confirmed') {
    const who = g.reviewedBy ? ` by ${escapeHtml(g.reviewedBy)}` : '';
    const on = g.receivedOn ? ` on ${escapeHtml(niceDate(g.receivedOn))}` : '';
    return `<span class="tiny" style="color:var(--ok-ink, var(--ok-ink)); font-weight:700;">Received${on}${who}</span>`;
  }
  if (g.status === 'rejected') {
    return `<span class="tiny" style="color:var(--bad-ink, #A93226); font-weight:700;">Not confirmed${g.reviewNotes ? ': ' + escapeHtml(g.reviewNotes) : ''}</span>`;
  }
  return '<span class="tiny muted">Waiting to be confirmed against the account</span>';
}

async function loadHistory() {
  const wrap = document.getElementById('giveHistory');
  try {
    const items = await fetchJSON('/api/giving/mine');
    wrap.innerHTML = items.map(g => `
      <div class="give-history-row">
        <span>
          ${escapeHtml(PURPOSE_LABELS[g.purpose] || g.purpose)}: GH₵ ${Number(g.amount).toFixed(2)}
          <br>${giveStatusLine(g)}
        </span>
      </div>
    `).join('') || '<p class="empty-state">No giving history yet.</p>';
  } catch (e) {
    wrap.innerHTML = '<p class="empty-state">Log in to see your giving history.</p>';
  }
}

(async function () {
  await initLayout('/give.html');
  const authRes = await fetchJSON('/api/auth/me').catch(() => ({ member: null }));
  if (!authRes.member) {
    document.getElementById('payInfo').innerHTML = '<p class="empty-state">Please <a href="/login.html">log in</a> to give.</p>';
    document.getElementById('giveHistory').innerHTML = '';
    return;
  }
  try {
    const info = await fetchJSON('/api/giving/chapter-info');
    if (!info.configured) {
      document.getElementById('payInfo').innerHTML = '<p class="empty-state">Your chapter hasn\'t set up giving details yet. Check back soon.</p>';
    } else {
      const p = info.payment;
      const welfarePurposes = info.welfarePurposes || [];

      // Tithe goes to Welfare's own account. Telling somebody that in a
      // footnote while showing them the chapter number is how money ends up in
      // the wrong purse, so the number on screen changes with the purpose.
      function renderPayInfo() {
        const purpose = document.getElementById('purpose').value;
        const toWelfare = welfarePurposes.includes(purpose);
        const momoNumber = toWelfare ? p.welfareMomoNumber : p.momoNumber;
        const momoName = toWelfare ? p.welfareMomoName : p.momoName;
        document.getElementById('payInfo').innerHTML = `
          <div class="pay-details">
            <h2 style="margin-bottom:4px; font-size:1.2rem;">${escapeHtml(info.chapterName)}</h2>
            ${toWelfare
              ? `<p class="pill amber" style="margin:6px 0 12px;">Tithe goes to the Welfare account</p>`
              : ''}
            ${!toWelfare && p.provider ? `<dt>Giving Channel</dt><dd>${escapeHtml(p.provider)}</dd>` : ''}
            ${momoNumber
              ? `<dt>${toWelfare ? 'Welfare Mobile Money' : 'Mobile Money'}</dt><dd>${escapeHtml(momoNumber)}${momoName ? ': ' + escapeHtml(momoName) : ''}</dd>`
              : `<p class="empty-state" style="margin:8px 0;">${toWelfare
                  ? 'Welfare has not published its account yet. Ask the Welfare team before sending your tithe.'
                  : 'No mobile money number on file yet.'}</p>`}
            ${!toWelfare && p.bankName ? `<dt>Bank</dt><dd>${escapeHtml(p.bankName)}</dd>` : ''}
            ${!toWelfare && p.bankAccountNumber ? `<dt>Account</dt><dd>${escapeHtml(p.bankAccountName || '')} ${escapeHtml(p.bankAccountNumber)}</dd>` : ''}
            ${!toWelfare && p.donationDestination ? `<dt>General Giving</dt><dd>${escapeHtml(p.donationDestination)}</dd>` : ''}
            ${!toWelfare && p.welfareDestination ? `<dt>Welfare Giving</dt><dd>${escapeHtml(p.welfareDestination)}</dd>` : ''}
            <p style="font-size:0.8rem; color:var(--ink-faint); margin-top:14px;">Sent via your own MoMo/bank app. This page doesn't process payments directly.</p>
          </div>
        `;
      }
      document.getElementById('giveForm').style.display = 'block';
      document.getElementById('purpose').addEventListener('change', renderPayInfo);
      renderPayInfo();
    }
  } catch (e) {
    document.getElementById('payInfo').innerHTML = '<p class="empty-state">Could not load giving details right now.</p>';
  }
  loadHistory();
})();

document.getElementById('giveForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('giveSubmitBtn');
  const msg = document.getElementById('giveMsg');
  btn.disabled = true;
  try {
    await fetchJSON('/api/giving/intents', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: document.getElementById('amount').value,
        purpose: document.getElementById('purpose').value,
        method: document.getElementById('method').value,
        reference: document.getElementById('reference').value
      })
    });
    msg.textContent = 'Thank you! Finance will confirm this against the books.';
    msg.className = 'form-msg success';
    showToast('Giving recorded, thank you!', 'success');
    document.getElementById('giveForm').reset();
    loadHistory();
  } catch (err) {
    msg.textContent = err.message || 'Could not record this.';
    msg.className = 'form-msg error';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
