<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACONSU Content</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
<style>
  .video-container { position:relative; width:100%; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px; margin-bottom:16px; background:#000; }
  .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .video-facade { background:var(--surface-2); border:1px solid var(--line); }
  .video-facade-body { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; text-align:center; }
  .video-note { max-width:420px; margin:0; font-size:0.9rem; color:var(--ink-soft); }
  .cat-pills { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:20px; scrollbar-width:none; }
  .cat-pills::-webkit-scrollbar { display:none; }
  .cat-pill { padding:6px 16px; border-radius:6px; border:1px solid var(--line); background:var(--surface); font-size:0.85rem; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap; transition:all 0.15s ease; }
  .cat-pill.active, .cat-pill:hover { background:var(--brand-deep); color:#fff; border-color:var(--brand); }
  .search-bar { width:100%; padding:12px 18px; border-radius:6px; border:1.5px solid var(--line); font-size:0.95rem; margin-bottom:20px; outline:none; font-family:var(--font-body); }
  .search-bar:focus { border-color:var(--brand); }
  .search-context { margin:0 0 18px; padding:14px 16px; border-radius:14px; background:rgba(var(--brand-rgb), 0.06); color:var(--ink); }
  .search-focus-card { border:2px solid var(--brand-deep); box-shadow:0 10px 24px rgba(var(--brand-rgb), 0.12); }
  .live-badge { display:inline-flex; align-items:center; gap:6px; background:#dc2626; color:#fff; font-weight:800; font-size:0.75rem; text-transform:uppercase; padding:4px 10px; border-radius:6px; letter-spacing:0.05em; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--surface);  }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero" data-art="voice" data-hero-page="content">
  <div class="hero-content">
    <h1 id="contentTitle">ACONSU Media</h1>
    <p class="lede" id="contentLede"></p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container">
    <div id="searchContext"></div>
    <div id="filterContainer" style="display:none;">
      <input type="text" class="search-bar" id="contentSearch" placeholder="Search resources, topics, authors...">
      <div class="cat-pills" id="categoryPills"></div>
    </div>

    <div class="grid" id="contentGrid">
      <div class="skeleton skeleton-card" style="height:280px;"></div>
      <div class="skeleton skeleton-card" style="height:280px;"></div>
    </div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/content.js"></script>
</body>
</html>
