<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
<style>
  .search-context { max-width:760px; margin:0 auto 18px; padding:14px 16px; border-radius:14px; background:rgba(var(--brand-rgb), 0.06); color:var(--ink); }
  .search-focus-card { border:2px solid var(--brand-deep); box-shadow:0 10px 24px rgba(var(--brand-rgb), 0.12); }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero" data-art="gather" data-hero-page="events">
  <div class="hero-content">
    <h1>Events</h1>
    <div id="countdownWrap"></div>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:760px;">
    <div id="searchContext"></div>
    <div id="eventList" class="grid" style="grid-template-columns:1fr;"></div>
  </div>
</section>

<div class="pub-modal-backdrop" id="regModalBackdrop">
  <div class="pub-modal">
    <h2 id="regModalTitle">Register</h2>
    <p id="regAutofillNote" style="display:none; font-size:0.85rem; color:var(--ink-soft); margin-bottom:14px;"></p>
    <form id="regForm">
      <div class="field">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" required>
      </div>
      <div class="field">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="field">
        <label for="regPhone">Phone Number</label>
        <input type="tel" id="regPhone">
      </div>
      <div style="display:flex; gap:10px;">
      <p class="form-notice">Your details are used only for this event. <a href="/privacy.html">Privacy policy</a>.</p>
        <button type="submit" class="btn btn-primary" id="regSubmitBtn">Confirm Registration</button>
        <button type="button" class="btn btn-outline" id="regCancelBtn">Cancel</button>
      </div>
      <div class="form-msg" id="regMsg"></div>
    </form>
  </div>
</div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/share.js"></script>
<script src="/js/pages/events.js"></script>
</body>
</html>
