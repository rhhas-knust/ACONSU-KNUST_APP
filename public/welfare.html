<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welfare | ACONSU</title>
<script>
/* Set the theme before the first paint. A page that renders light and then
   flips to dark is worse than one that never offered dark at all. Inline and
   synchronous on purpose: an external file would arrive too late. */
(function(){try{var t=localStorage.getItem('aconsu.theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1A43">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/theme.css" id="brandTheme">
<script src="/js/brand.js"></script>
<style>
  .welfare-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .welfare-card .status-pill { display:inline-block; padding:3px 10px; border-radius:6px; font-size:0.72rem; font-weight:800; background:var(--tint-mid); color:var(--brand-strong); text-transform:capitalize; }
  .welfare-card .status-pill.fulfilled, .welfare-card .status-pill.approved { background:var(--ok-bg); color:var(--ok-ink); }
  .welfare-card .status-pill.declined { background:var(--bad-bg); color:var(--bad-ink); }
</style>
</head>
<body class="has-side-rail">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" tabindex="-1">

<section class="hero" data-art="flame" data-hero-page="welfare">
  <div class="hero-content">
    <h1>Welfare</h1>
    <p class="lede">Going through something? Let us know how we can help. This is kept confidential.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:640px;">
    <form class="form-card" id="welfareForm">
      <div class="field">
        <label for="category">What kind of support do you need?</label>
        <select id="category">
          <option value="financial">Financial</option>
          <option value="medical">Medical</option>
          <option value="bereavement">Bereavement</option>
          <option value="academic">Academic</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="description">Tell us more</label>
        <textarea id="description" required placeholder="Share as much as you're comfortable with. Only the Welfare team sees this."></textarea>
      </div>
      <div class="field">
        <label for="amountRequested">Amount, if financial (optional)</label>
        <input type="number" id="amountRequested" min="0" step="0.01" placeholder="GH₵">
      </div>
      <p class="form-notice">Only the Welfare office and your Chapter Coordinator can read this. <a href="/privacy.html">Privacy policy</a>.</p>
      <button type="submit" class="btn btn-flame btn-block" id="welfareSubmitBtn">Submit Request</button>
      <div class="form-msg" id="welfareMsg"></div>
    </form>

    <div class="section-head" style="margin-top:48px;">
      <h2>What Welfare has received from you</h2>
    </div>
    <div id="myWelfareGiving"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>

    <div class="section-head" style="margin-top:48px;">
      <h2>Status</h2>
    </div>
    <div id="myRequests"><div class="skeleton-stack" role="status" aria-label="Loading"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script src="/js/pages/welfare.js"></script>
</body>
</html>
