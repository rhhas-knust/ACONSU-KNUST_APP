<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapters — ACONSU</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B2C82">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACONSU">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="site-header"></header>

<section class="hero" style="padding-bottom:48px;" id="deptsHero">
  <div class="hero-flame"></div>
  <div class="hero-content">
    <p class="eyebrow">Find Your Chapter</p>
    <h1>Chapters</h1>
    <p class="lede">Explore the ACONSU chapters serving students across campuses and communities. Each chapter has its own departments and leadership.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container">
    <div class="grid" id="deptGrid"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/main.js"></script>
<script>
(async function () {
  await initLayout('/departments.html');
  try {
    const chapters = await fetchJSON('/api/chapters');
    const wrap = document.getElementById('deptGrid');
    wrap.innerHTML = chapters.map(chapter => `
      <a href="/department.html?chapterId=${encodeURIComponent(chapter.id)}" class="card dept-card">
        <div class="dept-thumb">
          <span class="dept-thumb-fallback" style="display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#5B2C82,#E8971E); color:#fff; font-weight:800; font-size:1.75rem;">${escapeHtml((chapter.name || 'A').charAt(0))}</span>
        </div>
        <h3>${escapeHtml(chapter.name)}</h3>
        <p style="color:#5a4468; font-size:0.92rem;">${escapeHtml(chapter.fullName || chapter.institution || 'Chapter community')}</p>
        <div class="dept-meta">${escapeHtml(chapter.location || chapter.institution || 'ACONSU Chapter')}</div>
      </a>
    `).join('') || '<p class="empty-state">Chapters coming soon.</p>';
  } catch (e) {
    document.getElementById('deptGrid').innerHTML = '<p class="empty-state">Could not load chapters right now.</p>';
  }
  initScrollReveal('#deptGrid .card');
  try {
    const photos = await fetchJSON('/api/files?category=photo');
    const general = photos.filter(p => !p.pageSlug).slice(0, 4);
    if (general.length) {
      document.getElementById('deptsHero').style.overflow = 'visible';
      renderFloatingImages('deptsHero', general.map(p => p.id));
    }
  } catch (e) { /* decorative only */ }
})();
</script>
</body>
</html>
