# Describes the ACONSU web service for Render (render.com). Render only reads
# this when a service is created from it (New, then Blueprint); a service that
# already exists is not changed by it. It is here so the setup is written down
# and can be recreated: see docs/operations.md.
services:
  - type: web
    name: aconsu-knust-app
    runtime: node
    plan: free              # change to a paid plan to stop it sleeping
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production   # HTTPS-only cookies, HSTS, no default passwords
      - key: SESSION_SECRET
        generateValue: true # a long random value, made once by Render
      - key: ADMIN_USERNAME
        sync: false         # asked for when the service is created, never stored here
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false         # the address people use, for links in emails
